# ==============================================================================
# PRODUCTION DOCKER COMPOSE (Canlı Prod Ortamı Reçetesi - v1.2.0)
# ==============================================================================
# Mimari: Nginx Tersine Vekil (Reverse Proxy) Modeli
# - Backend API dış dünyaya (internete) TAMAMEN KAPATILMIŞTIR (Port 5001 yok!).
# - Tek açık kapı Nginx Web Sunucusudur (Port 80).
# ==============================================================================

services:
  # 1. Servis: PostgreSQL Veritabanı (Dışarıya Kapalı - Sadece İç Ağda)
  db:
    image: postgres:16-alpine
    container_name: veritabani-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_verisi_prod:/var/lib/postgresql/data

  # 2. Servis: Backend Node.js API (Dışarıya Kapalı - Sadece İç Ağda)
  backend:
    image: bemres/devops-backend:latest
    container_name: backend-api-prod
    restart: always
    # DİKKAT: 'ports:' bölümü kaldırıldı! Backend doğrudan internete erişilemez.
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 5000
    depends_on:
      - db

  # 3. Servis: Nginx Frontend & Tersine Vekil (Tek Açık Dış Kapı)
  frontend:
    image: bemres/devops-frontend:latest
    container_name: web-uygulamam-prod
    restart: always
    ports:
      # Standart HTTP portu (Port yazmadan doğrudan erişim)
      - "80:80"
    depends_on:
      - backend

# Prod Ortamı Kalıcı Veri Kasası
volumes:
  pg_verisi_prod:
