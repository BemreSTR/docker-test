server {
    listen 80;
    server_name localhost;

    # 1. Statik Web Sitesi Dosyaları (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Tersine Vekil (Reverse Proxy) Kuralı:
    # /api/ ile başlayan tüm istekleri Docker iç ağındaki Backend konteynırına ilet
    location /api/ {
        # 'backend' kelimesi docker-compose dosyasındaki servis adıdır.
        # Docker'ın dahili DNS sunucusu bunu otomatik olarak konteynır IP'sine çözer.
        proxy_pass http://backend:5000;

        # İstemci üst bilgilerini (Headers) backend'e eksiksiz ilet
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
