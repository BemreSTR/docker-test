# Docker Compose: Güvenli ve Parametrik Orkestrasyon
services:
  # 1. Servis: PostgreSQL Veritabanı
  db:
    image: postgres:16-alpine
    container_name: veritabani
    restart: unless-stopped
    environment:
      # Şifreler artık doğrudan kodda değil; .env dosyasından çekiliyor!
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_verisi:/var/lib/postgresql/data

  # 2. Servis: Node.js REST API
  backend:
    build: ./backend
    container_name: backend-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 5000
    depends_on:
      - db

  # 3. Servis: Nginx Frontend
  frontend:
    build: ./frontend
    container_name: web-uygulamam
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  pg_verisi:
    name: pg_verisi  # Manuel oluşturduğumuz mevcut kasayı doğrudan eşleştir!
