name: CI/CD Pipeline - Build, Test & Security Scan 🐳🛡️

# Hangi olayda tetiklenecek?
on:
  push:
    branches:
      - main  # Sadece 'main' dalına kod push edildiğinde otomatik çalışır

jobs:
  build-test-and-deploy:
    name: Test, Build & Deploy Pipeline
    runs-on: ubuntu-latest  # GitHub'ın buluttaki temiz Ubuntu sanal makinesinde koşar

    steps:
      # 1. Aşama: Depodaki en güncel kodları sanal makineye çek
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Aşama: 🧪 Otomatik Kalite Kapısı (Backend Birim Testleri)
      # DİKKAT: Testler başarısız olursa boru hattı burada durur! İmaj derlenmez, canlıya gidilmez!
      - name: Set up Node.js for Testing
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Run Backend Tests
        run: |
          cd backend
          npm ci
          npm test

      # 3. Aşama: Gelişmiş Docker Build motorunu (Buildx) hazırla
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Aşama: GitHub Secrets kullanarak Docker Hub'a güvenli giriş yap
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Aşama: Backend İmajını Otomatik Derle ve Docker Hub'a Push Et
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:1.2.0

      # 6. Aşama: Frontend İmajını Otomatik Derle ve Docker Hub'a Push Et
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:1.2.0

      # 7. Aşama: 🛡️ DevSecOps Güvenlik Taraması (Aqua Security Trivy)
      # Üretilen imajı güvenlik açıklarına (CVE) karşı otomatik tarar ve özet tablo çıkarır
      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:1.2.0
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 8. Aşama: VPS Sunucusuna Bağlan ve Canlıyı Güncelle (Full CD)
      # Yalnızca tüm testler ve derlemeler başarılı olursa canlı sunucu güncellenir
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/docker-test
            git pull origin main
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
